name: onshore_3rivers_vendors
description: "Onshore 3Rivers AI -- staff portal for work orders, shipments, suppliers, and vendors."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.4+1
  intl: ^0.19.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon_source.png"
  adaptive_icon_background: "#1FA463"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generate: false
