workflows:
  ios-appstore:
    name: Onshore 3Rivers Vendors — iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # The single App Store Connect API key connected to this account
      # (Developer Portal integration). Same key em-powered's pipeline uses.
      # Covers signing + publishing for every app under Apple team SC3TK2FMVZ.
      # If a build fails with "integration not found", check the exact name
      # at: Codemagic → Personal Settings → Integrations → Developer Portal.
      app_store_connect: empowered_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: "6760920784"
        # The app's compiled default is already
        # https://3rivers-v.onshoretech.ai (lib/core/config/env.dart) — this override is here only
        # to make the target explicit / easy to point at staging.
        API_BASE_URL: "https://3rivers-v.onshoretech.ai"
    scripts:
      - name: Flutter packages
        script: flutter packages pub get
      - name: Install pods
        script: find . -name "Podfile" -maxdepth 3 -execdir pod install \;
      - name: Fetch signing files and set up profiles
        script: |
          # Explicit, not automatic. Codemagic's automatic signing reported
          # "No matching profiles found" for this bundle while the profile
          # was demonstrably ACTIVE, so it was querying a different team or
          # key. These three env vars come from the app_store_connect
          # integration; --create makes the profile if the lookup is empty.
          app-store-connect fetch-signing-files "ai.onshoretech.3riversv" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        # Leave beta_groups unset — reviewers pull from the build directly.

  android-playstore:
    name: Onshore 3Rivers Vendors — Android (Play, closed testing)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      android_signing:
        - onshore_3riversv_upload_keystore
      vars:
        API_BASE_URL: "https://3rivers-v.onshoretech.ai"
    scripts:
      - name: Flutter packages
        script: flutter packages pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    # Not wired to auto-publish yet -- no Google Play developer account
    # exists for this app's applicationId (ai.onshoretech.3riversv) yet. Once the new
    # Onshore org Play Console account is live and a service account key
    # with Release Manager access is generated, add:
    #   publishing:
    #     google_play:
    #       credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #       track: internal
    # Until then, download the .aab artifact from the build and upload it
    # to the closed testing track by hand.
